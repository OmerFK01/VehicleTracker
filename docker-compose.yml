services:
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15
  app1:
    build: .
    ports: ["8081:8080"]
    environment:
      - ConnectionStrings__Redis=redis:6379
      - RUN_SIMULATOR=true
    depends_on:
      redis:
        condition: service_healthy
  app2:
    build: .
    ports: ["8082:8080"]
    environment:
      - ConnectionStrings__Redis=redis:6379
      - RUN_SIMULATOR=false
    depends_on:
      redis:
        condition: service_healthy